[package]
name = "rubevy"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Run mruby bytecode (via SabiRuby) inside Bevy"
keywords = ["bevy", "mruby", "ruby", "scripting"]

[features]
default = []
# `require` of a `.rb` file, which needs the reference compiler (a C build). Without it a script
# may still `require` a `.mrb`.
ruby-source = ["dep:sabiruby-compiler"]

[dependencies]
# https://crates.io/crates/sabiruby, from crates.io like any other dependency, so that a clone
# of this repository alone builds. To work against a checkout of the VM next to this one, put
# the redirect in `.cargo/config.toml` (git-ignored), which leaves this file alone:
#   [patch.crates-io]
#   sabiruby = { path = "../sabiruby" }
#   sabiruby-compiler = { path = "../sabiruby/compiler" }
sabiruby = "0.3"
bevy = { version = "0.19.1", default-features = false, features = ["bevy_asset", "bevy_log"] }
thiserror = "2"
# only for the `ruby-source` feature
sabiruby-compiler = { version = "0.2", features = ["host"], optional = true }

[dev-dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["bevy_asset", "bevy_log", "bevy_window", "bevy_winit", "x11"] }
