[package]
name = "rubevy"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Run mruby bytecode (via SabiRuby) inside Bevy"
keywords = ["bevy", "mruby", "ruby", "scripting"]

[features]
default = []
# `require` of a `.rb` file, which needs the reference compiler (a C build). Without it a script
# may still `require` a `.mrb`.
ruby-source = ["dep:sabiruby-compiler"]

[dependencies]
# The VM, from git while the host entry points this plugin needs are still being added (the
# published 0.4.0 is behind). A clone of this repository still builds on its own — cargo fetches
# it — and this goes back to a crates.io version once the API settles. To work against a checkout
# of the VM next to this one, put the redirect in `.cargo/config.toml` (git-ignored):
#   [patch."https://github.com/kishima/sabiruby"]
#   sabiruby = { path = "../sabiruby" }
sabiruby = { git = "https://github.com/kishima/sabiruby" }
bevy = { version = "0.19.1", default-features = false, features = ["bevy_asset", "bevy_log"] }
thiserror = "2"
# only for the `ruby-source` feature
sabiruby-compiler = { git = "https://github.com/kishima/sabiruby", features = ["host"], optional = true }

[dev-dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["bevy_asset", "bevy_log", "bevy_window", "bevy_winit", "x11"] }
# the tests compile their Ruby in process
sabiruby-compiler = { git = "https://github.com/kishima/sabiruby", features = ["host"] }
